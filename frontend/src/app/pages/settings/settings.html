<header class="top-bar">
  <h1>Nastavení</h1>
</header>

<div class="settings-container">

  <div class="settings-card">
    <h3>Aplikace</h3>
    
    <div class="setting-row">
      <div class="label-group">
        <i class="material-icons icon">payments</i>
        <span>Hlavní měna</span>
      </div>
      <select [(ngModel)]="nastaveni.mena">
        <option value="CZK">CZK (Kč)</option>
        <option value="EUR">EUR (€)</option>
        <option value="USD">USD ($)</option>
      </select>
    </div>

    <div class="setting-row">
      <div class="label-group">
        <i class="material-icons icon">translate</i>
        <span>Jazyk aplikace</span>
      </div>
      <select [(ngModel)]="nastaveni.jazyk">
        <option value="cz">Čeština</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="setting-row">
      <div class="label-group">
        <i class="material-icons icon">dark_mode</i>
        <span>Tmavý režim</span>
      </div>
      <label class="switch">
        <input type="checkbox" [(ngModel)]="nastaveni.tmavyRezim">
        <span class="slider round"></span>
      </label>
    </div>
  </div>


  <div class="settings-card">
    <h3>Peníze</h3>
    
    <div class="setting-row">
      <div class="label-group">
        <i class="material-icons icon">account_balance_wallet</i>
        <span>Počáteční zůstatek</span>
      </div>
      <div class="balance-display">
        <span *ngIf="!isEditingBalance" class="balance-value">{{ nastaveni.initialBalance }} {{ nastaveni.mena }}</span>
        <input 
          *ngIf="isEditingBalance" 
          type="number" 
          [(ngModel)]="tempBalance" 
          step="0.01" 
          class="balance-input"
        >
        <button 
          *ngIf="!isEditingBalance" 
          (click)="editBalance()" 
          class="btn-edit"
        >
          <i class="material-icons">edit</i>
        </button>
        <div *ngIf="isEditingBalance" class="edit-buttons">
          <button (click)="saveBalance()" class="btn-save">Uložit</button>
          <button (click)="cancelEditBalance()" class="btn-cancel">Zrušit</button>
        </div>
      </div>
    </div>
  </div>


  <div class="settings-card danger-zone">
    <h3>Správa dat</h3>
    <p class="warning-text">Pokud smažete data, nebude možné je obnovit.</p>
    
    <div class="buttons-row">
      <button class="btn-save" (click)="ulozitNastaveni()">Uložit změny</button>
      <button class="btn-delete" (click)="resetovatData()">Smazat všechna data</button>
    </div>
  </div>

</div>
