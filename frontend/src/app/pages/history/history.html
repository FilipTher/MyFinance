<div class="page-layout">
  
  <aside class="filters-panel">
    <div class="filter-header">
      <h3>Filtry</h3>
      <i class="material-icons icon">filter_alt</i>
    </div>
    <hr>

    <div class="form-group">
      <label>Hledat</label>
      <input type="text" placeholder="Hledat v popisu..." [(ngModel)]="filtry.hledat" (change)="applyFilters()">
    </div>

    <div class="form-group">
      <label>Typ platby</label>
      <select [(ngModel)]="filtry.typ" (change)="applyFilters()">
        <option value="vse">Všechny</option>
        <option value="prijem">Příjem</option>
        <option value="vydaj">Výdaj</option>
      </select>
    </div>

    <div class="form-group">
      <label>Kategorie</label>
      <select [(ngModel)]="filtry.kategorie" (change)="applyFilters()">
        <option value="vse">Všechny</option>
        <option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <div class="slider-labels">
        <label>Částka: {{ filtry.castkaMin }} - {{ filtry.castkaMax }} CZK</label>
      </div>
      <input type="range" min="0" max="100000" [(ngModel)]="filtry.castkaMin" (change)="applyFilters()">
      <input type="range" min="0" max="100000" [(ngModel)]="filtry.castkaMax" (change)="applyFilters()">
    </div>

  </aside>


  <section class="results-panel">
    
    <div class="date-bar">
      <h2>Historie transakcí</h2>
      <div class="date-inputs">
        <div class="date-group">
          <span>Od</span>
          <input type="date" [(ngModel)]="filtry.datumOd" (change)="applyFilters()" class="date-input">
        </div>
        <span class="arrow">→</span>
        <div class="date-group">
          <span>Do</span>
          <input type="date" [(ngModel)]="filtry.datumDo" (change)="applyFilters()" class="date-input">
        </div>
      </div>
      <div class="action-buttons">
        <button 
          class="btn btn-edit" 
          [disabled]="!isEditEnabled()"
          (click)="editSelected()"
          title="Upravit vybranou transakci">
          <i class="material-icons">edit</i>
          Upravit
        </button>
        <button 
          class="btn btn-delete" 
          [disabled]="!isDeleteEnabled()"
          (click)="deleteSelected()"
          title="Smazat vybrané transakce">
          <i class="material-icons">delete</i>
          Smazat
        </button>
      </div>
    </div>

    <div class="transaction-list">
      <div *ngIf="filteredTransactions.length === 0" class="no-transactions">
        Žádné transakce k dispozici
      </div>
      <div class="transaction-row" *ngFor="let item of filteredTransactions">
        
        <input type="checkbox" class="custom-checkbox" [(ngModel)]="item.vybrano">
        
        <i class="material-icons icon">{{ item.ikona }}</i>
        
        <div class="info">
          <div class="name">{{ item.nazev }}</div>
        </div>

        <div class="type-badge">
          <span class="dot" [class.green]="item.typ === 'prijem'" [class.red]="item.typ === 'vydaj'">●</span>
          {{ item.typ === 'prijem' ? 'Příjem' : 'Výdaj' }}
        </div>

        <div class="desc" *ngIf="item.popis">{{ item.popis }}</div>

        <div class="price" [style.color]="item.castka > 0 ? 'var(--accent-green)' : 'var(--accent-red)'">
          {{ item.castka > 0 ? '+' : '' }}{{ item.castka }} CZK
          <div class="date-sub">{{ item.datumFormatovano }}</div>
        </div>
      </div>
    </div>

  </section>

  <!-- Edit Transaction Modal -->
  <div class="modal-overlay" *ngIf="editModalOpen" (click)="closeEditModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Upravit transakci</h2>
        <button class="close-btn" (click)="closeEditModal()">
          <i class="material-icons">close</i>
        </button>
      </div>

      <div class="modal-body" *ngIf="editingTransaction">
        <div class="form-group">
          <label>Typ transakce</label>
          <select [(ngModel)]="editFormData.type">
            <option value="expense">Výdaj</option>
            <option value="income">Příjem</option>
          </select>
        </div>

        <div class="form-group">
          <label>Kategorie</label>
          <select [(ngModel)]="editFormData.category" required>
            <option [value]="null">Vyberte kategorii</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Částka</label>
          <input 
            type="number" 
            [(ngModel)]="editFormData.amount" 
            step="0.01"
            min="0"
            required
          />
        </div>

        <div class="form-group">
          <label>Datum</label>
          <input 
            type="date" 
            [(ngModel)]="editFormData.date"
            required
          />
        </div>

        <div class="form-group">
          <label>Popis</label>
          <textarea 
            [(ngModel)]="editFormData.description"
            rows="4"
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeEditModal()">Zrušit</button>
        <button class="btn-primary" (click)="saveEditedTransaction()">Uložit</button>
      </div>
    </div>
  </div>

</div>
